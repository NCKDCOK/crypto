[project]
name = "crypto-capital-behavior"
version = "0.1.0"
description = "资金行为驱动的实时行情分析系统 — 不执行自动交易"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.5,<3",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29",
    "websockets>=12",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
