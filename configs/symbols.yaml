# Symbol 过滤与分级配置
quote_asset: USDT
exclude_patterns: []          # blacklist：symbol 含这些子串则排除
whitelist: []                 # whitelist：非空时只保留这些 symbol
liquidity_floor_usdt: 5000000 # 24h 成交额下限
top_n: 100                    # 按 24h quote volume 排序保留前 N
max_symbols: 100              # universe 总量上限
activity_tiers:
  active: 50000000   # 24h 成交额 > 50M USDT
  normal: 5000000    # > 5M USDT
